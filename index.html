<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6f9d4f">
  <title>3件まとめてLP作成｜はなまる花店</title>
  <link rel="icon" href="icon.png" type="image/png">
  <style>
    :root{color-scheme:light;--g9:#315629;--g7:#557f3f;--g5:#82ad5d;--g2:#dcecc9;--g1:#eef6e5;--cream:#f8fbf3;--paper:#fff;--ink:#20301d;--muted:#657060;--line:#dce6d6;--danger:#a14943;--shadow:0 18px 55px rgba(54,89,43,.11)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 6% 4%,rgba(220,236,201,.65),transparent 25rem),var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.65}button,textarea{font:inherit}button{touch-action:manipulation}[hidden]{display:none!important}
    .page-header{position:relative;overflow:hidden;border-bottom:1px solid rgba(85,127,63,.14);background:var(--paper)}.header-photo{position:absolute;inset:0 0 0 auto;width:min(48vw,650px);height:100%;object-fit:cover;opacity:.2;mask-image:linear-gradient(90deg,transparent,#000 45%)}.header-inner{position:relative;display:flex;align-items:center;gap:20px;width:min(100% - 32px,1180px);min-height:132px;margin:auto;padding:18px 0}.brand-logo{width:88px;height:88px;flex:0 0 auto;object-fit:contain}.eyebrow{margin:0 0 3px;color:var(--g7);font-size:.82rem;font-weight:900;letter-spacing:.09em}h1{margin:0;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(1.9rem,4vw,3rem);line-height:1.2;letter-spacing:-.03em}.header-copy{margin:8px 0 0;color:var(--muted)}
    .workspace{display:grid;grid-template-columns:minmax(320px,.72fr) minmax(0,1.28fr);gap:24px;width:min(100% - 32px,1180px);margin:30px auto 70px;align-items:start}.panel{border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.96);box-shadow:var(--shadow)}.input-panel{position:sticky;top:18px;padding:clamp(22px,4vw,34px)}.step-heading{display:flex;align-items:center;gap:13px;margin-bottom:10px}.step-number{display:grid;width:38px;height:38px;flex:0 0 auto;place-items:center;border-radius:50%;color:white;background:var(--g7);font-weight:900}h2{margin:0;font-size:1.22rem;line-height:1.35}.description{margin:0 0 15px;color:var(--muted);font-size:.92rem}.format-guide{margin:0 0 10px;padding:11px 13px;border-radius:12px;color:var(--g9);background:var(--g1);font-size:.82rem}
    textarea{display:block;width:100%;min-height:220px;padding:16px 18px;resize:vertical;border:2px solid var(--line);border-radius:16px;color:var(--ink);background:#fff;line-height:1.75;transition:border-color .15s,box-shadow .15s}textarea:focus{outline:none;border-color:var(--g5);box-shadow:0 0 0 4px rgba(130,173,93,.14)}.field-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.count-badge{padding:5px 11px;border-radius:999px;color:var(--g9);background:var(--g1);font-size:.83rem;font-weight:900}
    .primary-button,.copy-button{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:10px 20px;border-radius:13px;font-weight:900;cursor:pointer;transition:transform .15s,background .15s,border-color .15s}.primary-button{border:0;color:white;background:var(--g7);box-shadow:0 9px 24px rgba(85,127,63,.22)}.primary-button:hover{background:var(--g9);transform:translateY(-1px)}.primary-button:active,.copy-button:active{transform:translateY(1px)}.button-icon{width:25px;height:25px;object-fit:contain}.copy-button{min-height:42px;padding:8px 15px;border:1px solid #abc59a;color:var(--g9);background:white;font-size:.88rem}.copy-button:hover{background:var(--g1);border-color:var(--g5)}button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:4px solid rgba(130,173,93,.25);outline-offset:3px}.message{margin:14px 0 0;padding:10px 13px;border-radius:11px;color:var(--g9);background:var(--g1);font-size:.88rem;font-weight:700}.message.error{color:var(--danger);background:#fff0ee}
    .results{overflow:hidden}.results-header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:23px 24px 18px;border-bottom:1px solid var(--line)}.results-count{min-width:34px;padding:3px 9px;border-radius:999px;color:white;background:var(--g7);text-align:center;font-size:.82rem;font-weight:900}.result-list{display:grid;gap:14px;padding:16px}.empty-state{padding:70px 24px;color:var(--muted);text-align:center}.empty-state img{width:82px;height:82px;margin-bottom:12px;object-fit:contain;opacity:.72}.empty-state strong{display:block;margin-bottom:5px;color:var(--ink)}.result-item{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:white}.result-item[open]{border-color:#b7cf9f;box-shadow:0 11px 30px rgba(54,89,43,.1)}.result-item summary{position:relative;padding:17px 48px 17px 18px;list-style:none;cursor:pointer}.result-item summary::-webkit-details-marker{display:none}.result-item summary::after{content:"+";position:absolute;top:15px;right:18px;color:var(--g7);font-size:1.35rem;font-weight:700}.result-item[open] summary::after{content:"−"}.result-heading{display:flex;align-items:center;gap:10px}.result-number{display:grid;width:30px;height:30px;flex:0 0 auto;place-items:center;border-radius:50%;color:white;background:var(--g7);font-size:.82rem;font-weight:900}.result-title{font-weight:900}.result-meta{display:block;margin:4px 0 0 40px;color:var(--muted);font-size:.76rem}.result-body{padding:16px;border-top:1px solid var(--line);background:#f7faf4}
    .lp-preview{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:white}.lp-hero{position:relative;min-height:290px;padding:30px;display:flex;align-items:flex-end;overflow:hidden;color:white}.lp-hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.lp-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(32,48,29,.9),rgba(32,48,29,.3))}.lp-hero-copy{position:relative;z-index:1;max-width:75%}.lp-mini-logo{width:72px;height:72px;margin-bottom:14px;border-radius:14px;background:rgba(255,255,255,.9);object-fit:contain}.lp-kicker{margin:0 0 6px;color:#e8f4d9;font-size:.83rem;font-weight:900}.lp-hero h3{margin:0;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(1.8rem,5vw,3.1rem);line-height:1.2}.lp-hero-text{margin:12px 0 0}.lp-content{padding:clamp(24px,5vw,42px)}.lp-section+.lp-section{margin-top:34px;padding-top:30px;border-top:1px solid var(--line)}.lp-label{margin:0 0 5px;color:var(--g7);font-size:.76rem;font-weight:900;letter-spacing:.11em}.lp-content h4{margin:0 0 12px;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:1.45rem}.lp-content p{margin:0;white-space:pre-line}.recommend-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}.recommend-list li{padding:10px 13px;border-radius:11px;background:var(--g1)}.recommend-list li::before{content:"✓";margin-right:9px;color:var(--g7);font-weight:900}.price-box{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px;border-radius:14px;color:white;background:var(--g9)}.price-value{color:#e3f0c9;font-size:1.35rem;font-weight:900}.lp-actions{display:flex;justify-content:flex-end;margin-top:14px}
    @media(max-width:900px){.workspace{grid-template-columns:1fr}.input-panel{position:static}}@media(max-width:600px){.header-inner{min-height:116px;gap:13px}.brand-logo{width:70px;height:70px}.header-copy{display:none}.header-photo{width:75vw}.workspace{width:min(100% - 20px,1180px);margin-top:16px}.panel{border-radius:18px}.input-panel{padding:19px 16px}.field-footer{align-items:stretch;flex-direction:column}.primary-button{width:100%}.count-badge{align-self:flex-start}.lp-hero{min-height:330px;padding:22px}.lp-hero-copy{max-width:100%}.price-box{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="page-header"><img class="header-photo" src="main.png" alt=""><div class="header-inner"><img class="brand-logo" src="logo.png" alt="はなまる花店"><div><p class="eyebrow">はなまる花店</p><h1>3件まとめてLP作成</h1><p class="header-copy">3商品を入力すると、このページ内ですぐに3本のLPが完成します。</p><p><a class="copy-button" href="blog/index.html">ブログを見る</a></p></div></div></header>
  <section class="panel" style="width:min(100% - 32px,1180px);margin:24px auto;padding:24px" aria-labelledby="team-pages-title">
    <h2 id="team-pages-title">LPチームが作成したページ</h2>
    <p>ファイルに保存済みのLPです。ブラウザを閉じても、この一覧から開けます。</p>
    <article style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      <img src="img/main.svg" alt="秋の寄せ植えの文字図版" style="width:180px;border-radius:12px">
      <div><h3>秋の寄せ植え</h3><p>公開済み／申込先は要確認</p><a class="copy-button" href="autumn-planter/index.html">LPを開く</a></div>
    </article>
    <article style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:24px">
      <img src="img/dry-flower-workshop/main.svg" alt="ドライフラワーのワークショップの文字図版" style="width:180px;border-radius:12px">
      <div><h3>ドライフラワーのワークショップ</h3><p>公開済み／申込先などは要確認</p><a class="copy-button" href="dry-flower-workshop/index.html">LPを開く</a> <a href="dry-flower-workshop/修正済みLP.md">原稿を開く</a></div>
    </article>
  </section>
  <main class="workspace">
    <section class="panel input-panel" aria-labelledby="products-title">
      <div class="step-heading"><span class="step-number">1</span><h2 id="products-title">商品を3行入力</h2></div>
      <p class="description">1商品につき1行で、3件入力してください。</p>
      <p class="format-guide"><strong>入力順：</strong>商品名｜相手｜強み｜料金｜申込方法</p>
      <textarea id="products-input" placeholder="春の花束レッスン｜初心者の方｜少人数でゆっくり作れる｜3,500円｜LINEで申込&#10;母の日アレンジメント｜贈り物を探す方｜ラッピング込み｜5,000円｜店頭で申込&#10;季節のお花定期便｜毎月花を楽しみたい方｜月1回配送｜4,800円｜フォームで申込" aria-describedby="product-count"></textarea>
      <div class="field-footer"><span class="count-badge" id="product-count">0 / 3件</span><button class="primary-button" id="create-lps" type="button"><img class="button-icon" src="icon.png" alt="">3本のLPを作る</button></div>
      <p class="message" id="status-message" role="status" hidden></p>
    </section>
    <section class="panel results" aria-labelledby="results-title"><div class="results-header"><div><p class="eyebrow">完成したLP</p><h2 id="results-title">番号順に一覧表示</h2></div><span class="results-count" id="results-count">0</span></div><div class="result-list" id="result-list"></div></section>
  </main>
  <script>
    const STORAGE_KEY='hanamaru-lp-maker-v2',DRAFT_KEY='hanamaru-lp-maker-draft-v2';
    const productsInput=document.getElementById('products-input'),productCount=document.getElementById('product-count'),resultList=document.getElementById('result-list'),resultsCount=document.getElementById('results-count'),statusMessage=document.getElementById('status-message');
    let generatedLPs=readStorage(STORAGE_KEY,[]);
    function readStorage(key,fallback){try{const value=JSON.parse(localStorage.getItem(key));return value??fallback}catch{return fallback}}
    function getLines(){return productsInput.value.split(/\r?\n/).map(line=>line.trim()).filter(Boolean)}
    function updateCount(){const count=getLines().length;productCount.textContent=`${count} / 3件`;const invalid=count>3;productCount.style.color=invalid?'var(--danger)':'';productCount.style.background=invalid?'#fff0ee':'';return count}
    function parseProduct(line,number){const parts=line.split(/\s*(?:｜|\||\t)\s*/).map(value=>value.trim());const product=parts[0]||`商品 ${number}`;return{id:`${Date.now()}-${number}`,number,product,audience:parts[1]||'花のある暮らしを楽しみたい方',strength:parts[2]||'はなまる花店が心を込めてご用意します',price:parts[3]||'お問い合わせください',application:parts[4]||'店頭またはLINEでお申し込みください',createdAt:new Date().toISOString()}}
    function makeCopy(lp){return`【${lp.product}】\n\n${lp.audience}へ。\n${lp.strength}。はなまる花店から、あなたにぴったりの「${lp.product}」をご案内します。\n\n■ こんな方におすすめ\n・${lp.audience}\n・${lp.product}を探している方\n・「${lp.strength}」に魅力を感じる方\n\n■ 商品の魅力\n${lp.strength}。花のある時間を、気軽に心地よく楽しんでいただける商品です。\n\n■ ご利用の流れ\n1. ${lp.application}\n2. ご案内に沿って「${lp.product}」をお楽しみください。\n\n■ 料金\n${lp.price}\n\n■ お申し込み方法\n${lp.application}\n\n■ よくある質問\nQ. どんな人に向いていますか？\nA. ${lp.audience}におすすめです。\n\nQ. どんな特徴がありますか？\nA. ${lp.strength}。\n\nQ. 料金と申込方法を教えてください。\nA. 料金は${lp.price}。${lp.application}。\n\n気になる方は、どうぞ気軽にお申し込みください。`}
    function element(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
    function addSection(parent,labelText,titleText,contentNode){const section=element('section','lp-section');section.append(element('p','lp-label',labelText),element('h4','',titleText),contentNode);parent.append(section)}
    function buildPreview(lp){const preview=element('article','lp-preview'),hero=element('div','lp-hero'),photo=element('img','lp-hero-photo');photo.src='main.png';photo.alt='';const heroCopy=element('div','lp-hero-copy'),logo=element('img','lp-mini-logo');logo.src='logo.png';logo.alt='はなまる花店';heroCopy.append(logo,element('p','lp-kicker',`${lp.audience}へ`),element('h3','',lp.product),element('p','lp-hero-text',`${lp.strength}。花のある素敵な時間をお届けします。`));hero.append(photo,heroCopy);const content=element('div','lp-content'),recommendations=element('ul','recommend-list');[lp.audience,`${lp.product}を探している方`,`「${lp.strength}」に魅力を感じる方`].forEach(text=>recommendations.append(element('li','',text)));addSection(content,'FOR YOU','こんな方におすすめ',recommendations);addSection(content,'FEATURE','この商品の魅力',element('p','',`${lp.strength}。花のある時間を、気軽に心地よく楽しんでいただける商品です。`));addSection(content,'HOW TO','ご利用の流れ',element('p','',`1. ${lp.application}\n2. ご案内に沿って「${lp.product}」をお楽しみください。`));const priceBox=element('div','price-box'),priceColumn=element('div'),applyColumn=element('div');priceColumn.append(element('p','lp-label','料金'),element('p','price-value',lp.price));applyColumn.append(element('p','lp-label','お申し込み方法'),element('p','',lp.application));priceBox.append(priceColumn,applyColumn);addSection(content,'PRICE & ENTRY','料金とお申し込み',priceBox);addSection(content,'FAQ','よくある質問',element('p','',`どんな人に向いていますか？\n${lp.audience}におすすめです。\n\nどんな特徴がありますか？\n${lp.strength}。\n\n料金と申込方法を教えてください。\n${lp.price}。${lp.application}。`));preview.append(hero,content);return preview}
    async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch{const temporary=document.createElement('textarea');temporary.value=text;temporary.style.position='fixed';temporary.style.opacity='0';document.body.appendChild(temporary);temporary.select();const copied=document.execCommand('copy');temporary.remove();return copied}}
    function formatDate(value){return new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value))}
    function renderResults(openNumber=0){resultList.replaceChildren();resultsCount.textContent=generatedLPs.length;if(!generatedLPs.length){const empty=element('div','empty-state'),icon=element('img');icon.src='icon.png';icon.alt='';empty.append(icon,element('strong','','商品を3件入力してください'),element('span','','ボタンを押すと、ここに3本のLPが番号順で表示されます。'));resultList.append(empty);return}generatedLPs.slice().sort((a,b)=>a.number-b.number).forEach(lp=>{const details=element('details','result-item');details.open=lp.number===openNumber;const summary=element('summary'),heading=element('span','result-heading');heading.append(element('span','result-number',String(lp.number)),element('span','result-title',lp.product));summary.append(heading,element('span','result-meta',`${formatDate(lp.createdAt)} 保存`));const body=element('div','result-body');body.append(buildPreview(lp));const actions=element('div','lp-actions'),copyButton=element('button','copy-button','このLPをコピー');copyButton.type='button';copyButton.addEventListener('click',async()=>{const copied=await copyText(makeCopy(lp));copyButton.textContent=copied?'コピーしました':'コピーできませんでした';setTimeout(()=>{copyButton.textContent='このLPをコピー'},1800)});actions.append(copyButton);body.append(actions);details.append(summary,body);resultList.append(details)})}
    function showStatus(text,isError=false){statusMessage.textContent=text;statusMessage.classList.toggle('error',isError);statusMessage.hidden=false}
    document.getElementById('create-lps').addEventListener('click',()=>{const lines=getLines();if(lines.length!==3){showStatus(`商品を3件入力してください。現在は${lines.length}件です。`,true);productsInput.focus();return}generatedLPs=lines.map((line,index)=>parseProduct(line,index+1));localStorage.setItem(STORAGE_KEY,JSON.stringify(generatedLPs));localStorage.setItem(DRAFT_KEY,productsInput.value);renderResults(1);showStatus('3本のLPを作成して保存しました。右の一覧から1本ずつ開けます。');document.querySelector('.results').scrollIntoView({behavior:'smooth',block:'start'})});
    productsInput.addEventListener('input',()=>{updateCount();localStorage.setItem(DRAFT_KEY,productsInput.value);statusMessage.hidden=true});
    productsInput.value=localStorage.getItem(DRAFT_KEY)||'';if(!Array.isArray(generatedLPs))generatedLPs=[];generatedLPs=generatedLPs.filter(lp=>lp&&lp.number>=1&&lp.number<=3).sort((a,b)=>a.number-b.number);updateCount();renderResults();
  </script>
</body>
</html>
